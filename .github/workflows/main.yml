
name: Deploy via SSH (no external actions)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Git branch to build"
        default: "raccoon-run-game-test-100"
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Write SSH key (from secrets)
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          echo "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          # Preload host key to avoid interactive prompt (optional)
          ssh-keyscan -H "$SSH_HOST" >> "$HOME/.ssh/known_hosts" || true

      - name: Deploy over SSH
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          BRANCH: ${{ github.event.inputs.branch }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/id_ed25519" -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" << 'EOF'
            set -e
            cd /root

            # Refresh repo
            rm -rf r-finance-fe || true
            git clone -b "${BRANCH}" https://github.com/RadoslavAleksiev/r-finance-fe
            cd r-finance-fe

            # VM already authenticated to Docker Hub
            docker build -t rado23/r-finance-fe:raccoon-test .
            docker push rado23/r-finance-fe:raccoon-test

            # Restart deployment to apply new image
            kubectl rollout restart deployment/r-finance-fe -n default
            kubectl rollout status deployment/r-finance-fe -n default --timeout=5m

            # Optional visibility
            kubectl -n default get pods -l app=r-finance-fe -o wide || true
          EOF
