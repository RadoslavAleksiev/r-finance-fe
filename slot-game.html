    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndqdXZ1eHNha3docmxydWx2aXF2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjYzMzU3OTUsImV4cCI6MjA4MTkxMTc5NX0.h5m8YKqvr8cyg6tPNw2MASCV9XrUJo7a4UYgaRvf7_4';

    const symbols = ['🦝', '🌙', '⭐', '🎰', '💎', '🍀', '🎪', '🎯'];
    let wallet = '';
    let isLoggedIn = false;
    let spins = 0;

    let history = [];
    let soundEnabled = true;
    let spinning = false;
    let canStop = false;
    let reels = [0, 0, 0, 0, 0, 0, 0, 0, 0];
    let captchaQuestion = { q: '', a: 0 };
    let spinInterval = null;
    let audioContext = null;

    function init() {
      audioContext = new (window.AudioContext || window.webkitAudioContext)();
      
      // Initialize background music with auto-loop
      bgMusicAudio = new Audio('/sounds/slot-bg-music.mp3');
      bgMusicAudio.loop = true;
      bgMusicAudio.volume = 0.3;
      
      // Add event listener to restart if loop fails
      bgMusicAudio.addEventListener('ended', function() {
        if (soundEnabled && isLoggedIn) {
          this.currentTime = 0;
          this.play().catch(e => console.log('Music restart blocked:', e));
        }
      });
      
      // Add error handler for music file
      bgMusicAudio.addEventListener('error', function(e) {

      });

      renderLogin();
      setupKeyboard();
      setupScrollButton();
    }

    function setupScrollButton() {
      window.onscroll = function() {
        const btn = document.getElementById("myBtn");
        if (document.body.scrollTop > 100 || document.documentElement.scrollTop > 100) {
          btn.style.display = "block";
        } else {
          btn.style.display = "none";
        }
      };
    }

    function generateCaptcha() {
      const num1 = Math.floor(Math.random() * 10) + 1;
      const num2 = Math.floor(Math.random() * 10) + 1;
      const ops = ['+', '-', '×'];
      const op = ops[Math.floor(Math.random() * ops.length)];
      let answer;
      
      switch(op) {
        case '+': answer = num1 + num2; break;
        case '-': answer = num1 - num2; break;
        case '×': answer = num1 * num2; break;
      }
      
      captchaQuestion = { q: `${num1} ${op} ${num2}`, a: answer };
    }

    function setupKeyboard() {
      document.addEventListener('keydown', (e) => {
        if (e.code === 'Space' && isLoggedIn) {
          e.preventDefault();
          if (spinning && canStop) {
            stopSpin();
          } else if (!spinning && spins > 0) {
            spin();
          }
        }
      });
    }

    function playSound(type) {
      if (!soundEnabled || !audioContext) return;
      
      const ctx = audioContext;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      
      if (type === 'win') {
        [523, 659, 784, 1047].forEach((f, i) => {
          const o = ctx.createOscillator();
          const g = ctx.createGain();
          o.connect(g);
          g.connect(ctx.destination);
          o.frequency.value = f;
          g.gain.setValueAtTime(0.3, ctx.currentTime + i * 0.1);
          g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + i * 0.1 + 0.3);
          o.start(ctx.currentTime + i * 0.1);
          o.stop(ctx.currentTime + i * 0.1 + 0.3);
        });
      } else if (type === 'spin') {
        osc.frequency.setValueAtTime(200, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(800, ctx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
        osc.start();
        osc.stop(ctx.currentTime + 0.1);
      }
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      if (bgMusicAudio) {
        if (soundEnabled) {
          bgMusicAudio.play().catch(e => console.log('Music play blocked:', e));
        } else {
          bgMusicAudio.pause();
        }
      }
      renderGame();
    }

    function refillSpins() {
      spins += 10;
      alert('🎉 +10 Free Spins Added!');
      renderGame();
    }

    async function saveWin(amount, symbolsArr) {
      try {
        const winData = {
          id: `win_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`,
          wallet: wallet,
          amount: amount,
          symbols: symbolsArr,
          timestamp: new Date().toISOString(),
          paid: false
        };

        console.log('Saving win to Supabase:', winData);

        const response = await fetch(`${SUPABASE_URL}/rest/v1/wins`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
            'Prefer': 'return=representation'
          },
          body: JSON.stringify(winData)
        });

        const responseText = await response.text();
        console.log('Supabase response status:', response.status);
        console.log('Supabase response:', responseText);

        if (!response.ok) {
          throw new Error(`Failed to save win: ${response.status} - ${responseText}`);
        }
        
        console.log('Win saved to Supabase successfully!');
      } catch (error) {
        console.error('Failed to save win:', error);
        alert('Warning: Win was not saved to database. Error: ' + error.message);
      }
    }

    function checkWin(newReels) {
      let win = 0;
      const rows = [
        [newReels[0], newReels[1], newReels[2]],
        [newReels[3], newReels[4], newReels[5]],
        [newReels[6], newReels[7], newReels[8]]
      ];
      const cols = [
        [newReels[0], newReels[3], newReels[6]],
        [newReels[1], newReels[4], newReels[7]],
        [newReels[2], newReels[5], newReels[8]]
      ];
      const diags = [
        [newReels[0], newReels[4], newReels[8]],
        [newReels[2], newReels[4], newReels[6]]
      ];

      [...rows, ...cols, ...diags].forEach(line => {
        const symbol = symbols[line[0]];
        if (line.every(idx => symbols[idx] === symbol)) {
          if (symbol === '🦝') win += 100;
          else if (symbol === '💎') win += 50;
          else if (symbol === '🍀') win += 30;
          else win += 20;
        }
      });

      return win;
    }

    function spin() {
      if (spins <= 0) {
        alert('No spins remaining!');
        return;
      }

      playSound('spin');
      spinning = true;
      canStop = false;

      setTimeout(() => { canStop = true; renderGame(); }, 1000);

      spinInterval = setInterval(() => {
        reels = reels.map(() => Math.floor(Math.random() * symbols.length));
        renderGame();
      }, 100);
    }

    function stopSpin() {
      if (!canStop) return;

      clearInterval(spinInterval);
      const finalReels = Array(9).fill(0).map(() => Math.floor(Math.random() * symbols.length));
      reels = finalReels;
      
      const win = checkWin(finalReels);
      
      if (win > 0) {
        setTimeout(() => playSound('win'), 300);
        totalWins += win;
        history = [{
          time: new Date().toLocaleTimeString(),
          win: win,
          symbols: finalReels.map(i => symbols[i])
        }, ...history].slice(0, 5);
        
        saveWin(win, finalReels.map(i => symbols[i]));
        
        setTimeout(() => {
          document.getElementById('winNotification').classList.add('hidden');
          renderGame();
        }, 3000);
      }
      
      spins--;
      spinning = false;
      canStop = false;
      renderGame();
      
      if (win > 0) {
        document.getElementById('winNotification').classList.remove('hidden');
        document.getElementById('winAmount').textContent = win;
      }
    }

    function handleLogin() {
      const walletInput = document.getElementById('walletInput').value;
      const captchaInput = parseInt(document.getElementById('captchaInput').value);

      if (!walletInput.trim()) {
        alert('Please enter your Solana wallet address');
        return;
      }
      
      if (captchaInput !== captchaQuestion.a) {
        alert('Incorrect captcha answer');
        generateCaptcha();
        renderLogin();
        return;
      }

      wallet = walletInput.trim();
      spins = 10;
      isLoggedIn = true;
      totalWins = 0;
      history = [];
      
      // Start background music
      if (bgMusicAudio && soundEnabled) {
        bgMusicAudio.play().catch(e => console.log('Music autoplay blocked:', e));
      }
      
      renderGame();
    }

    function logout() {
      isLoggedIn = false;
      wallet = '';
      spins = 0;
      
      // Stop background music
      if (bgMusicAudio) {
        bgMusicAudio.pause();
        bgMusicAudio.currentTime = 0;
      }
      
      generateCaptcha();
      renderLogin();
    }

    function renderLogin() {
      document.getElementById('app').innerHTML = `
        <div class="game-card">
          <div class="raccoon-icon">🦝</div>
          <h2>Connect Your Wallet</h2>
          
          <label>🔗 Solana Wallet Address</label>
          <input type="text" id="walletInput" placeholder="Enter your Solana wallet address">
          
          <label>🔒 Captcha: What is ${captchaQuestion.q}?</label>
          <input type="number" id="captchaInput" placeholder="Enter answer">
          
          <button onclick="handleLogin()">Connect & Get 10 Free Spins! 🎰</button>
          
          <div class="info-box">
            <h3>🎯 How to Play:</h3>
            <ul>
              <li>• Enter your Solana wallet address</li>
              <li>• Solve the simple math captcha</li>
              <li>• Get 10 free spins to start!</li>
              <li>• Match 3 symbols to win points!</li>
              <li>• Press SPACE or click to spin/stop</li>
            </ul>
          </div>
        </div>
      `;
    }

    function renderGame() {
      document.getElementById('app').innerHTML = `
        <div class="game-header">
          <div class="player-info">
            <h2>🦝 Raccoon Slots</h2>
            <p>Wallet: ${wallet.slice(0, 6)}...${wallet.slice(-4)}</p>
          </div>
          
          <div class="stats-container">
            <div class="stat-box">
              <div class="value">${spins}</div>
              <div class="label">Spins</div>
            </div>
            <div class="stat-box">
              <div class="value">${totalWins}</div>
              <div class="label">Wins</div>
            </div>
          </div>
          
          <div class="game-controls">
            <button class="icon-btn" onclick="toggleSound()">
              ${soundEnabled ? '🔊' : '🔇'}
            </button>
            <button class="icon-btn" onclick="refillSpins()" title="Get +10 Free Spins">
              +10 Spins⚡
            </button>
            <button class="logout-btn" onclick="logout()">Logout</button>
          </div>
        </div>

        <div class="game-grid">
          <div class="slot-machine">
            <div id="winNotification" class="win-notification hidden">
              <h3>🎉 YOU WIN <span id="winAmount">0</span> POINTS! 🎉</h3>
            </div>

            <div class="reels">
              ${reels.map((r) => `
                <div class="reel ${spinning ? 'spinning' : ''}">
                  ${symbols[r]}
                </div>
              `).join('')}
            </div>

            <button class="spin-button" onclick="${spinning && canStop ? 'stopSpin()' : 'spin()'}" 
              ${(spinning && !canStop) || (!spinning && spins <= 0) ? 'disabled' : ''}>
              ${spinning ? (canStop ? '⭐ STOP NOW! (SPACE) ⭐' : '🔄 SPINNING...') : (spins <= 0 ? 'NO SPINS LEFT' : '⭐ SPIN! (SPACE) ⭐')}
            </button>
            
            <div class="keyboard-hint">
              💡 Tip: Press <kbd>SPACE</kbd> to spin or stop anytime
            </div>
          </div>

          <div class="sidebar">
            <div class="paytable">
              <h3>🏆 Paytable</h3>
              ${[
                { symbol: '🦝', name: 'Raccoon', points: 100 },
                { symbol: '💎', name: 'Diamond', points: 50 },
                { symbol: '🍀', name: 'Clover', points: 30 },
                { symbol: '⭐', name: 'Star', points: 20 },
                { symbol: '🌙', name: 'Moon', points: 20 },
                { symbol: '🎰', name: 'Slot', points: 20 }
              ].map(item => `
                <div class="paytable-item">
                  <div style="display: flex; align-items: center;">
                    <span class="symbol">${item.symbol}</span>
                    <span>${item.name}</span>
                  </div>
                  <span class="points">${item.points}pts</span>
                </div>
              `).join('')}
              <div class="paytable-note">Match 3 in a row, column, or diagonal!</div>
            </div>

            ${history.length > 0 ? `
              <div class="recent-wins">
                <h3>🏆 Recent Wins</h3>
                ${history.map(item => `
                  <div class="win-item">
                    <div class="win-header">
                      <span class="win-amount">+${item.win} pts</span>
                      <span class="win-time">${item.time}</span>
                    </div>
                    <div class="win-symbols">
                      ${item.symbols.map(s => `<span>${s}</span>`).join('')}
                    </div>
                  </div>
                `).join('')}
              </div>
            ` : ''}
          </div>
        </div>
      `;
    }

    window.onload = init;
    window.handleLogin = handleLogin;
    window.logout = logout;
    window.spin = spin;
    window.stopSpin = stopSpin;
    window.toggleSound = toggleSound;
    window.refillSpins = refillSpins;
  </script>
</body>
</html>
